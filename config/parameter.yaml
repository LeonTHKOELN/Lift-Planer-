# ---------------------------------------------------------------------------
# Lift Planner Eigenbetrieb · zentrale Parameter
#
# Jede Rechnung der App liest ihre Werte ausschließlich aus dieser Datei
# (bzw. aus den in der App geänderten Werten). Neue Variable = neuer Eintrag.
#
# Felder je Parameter:
#   key        eindeutiger Name, wird im Code verwendet
#   label      Anzeigename
#   einheit    Einheit für Anzeige und Rechenweg
#   wert       Basiswert
#   min/max    zulässiger Bereich (Eingaben werden darauf begrenzt)
#   step       Schrittweite im Eingabefeld
#   typ        float (Standard), int oder bool
#   status     Annahme | Literaturwert | Herstellerangabe | Regelwerk | Validiert
#   quelle     Herkunft des Wertes
#   kommentar  optionale Erläuterung
# ---------------------------------------------------------------------------

gruppen:
- id: drohne
  titel: Drohne
  beschreibung: Leistungsdaten der eigenen Lastendrohne.
  parameter:
  - key: drohne.nutzlast_kg
    label: Maximale Last am Haken je Flug
    einheit: kg
    wert: 70
    min: 5
    max: 500
    step: 5
    status: Annahme
    quelle: Vorgabe Team (Eigenbetrieb)
    kommentar: Ladung plus Behälter. Grenze für die Lastplanung je Flug
  - key: drohne.v_reise_ms
    label: Reisegeschwindigkeit
    einheit: m/s
    wert: 10
    min: 1
    max: 30
    step: 0.5
    status: Annahme
    quelle: Planungswert mit Außenlast
  - key: drohne.steigrate_ms
    label: Steigrate
    einheit: m/s
    wert: 3
    min: 0.5
    max: 10
    step: 0.5
    status: Annahme
    quelle: Planungswert mit Außenlast
  - key: drohne.sinkrate_ms
    label: Sinkrate
    einheit: m/s
    wert: 3
    min: 0.5
    max: 10
    step: 0.5
    status: Annahme
    quelle: Planungswert mit Außenlast
- id: flugbetrieb
  titel: Flugbetrieb
  beschreibung: Zeiten am Boden je Flug.
  parameter:
  - key: flug.umlauf_min
    label: Bodenzeit je Umlauf
    einheit: min
    wert: 3
    min: 0
    max: 30
    step: 0.5
    status: Annahme
    quelle: Schätzung Team
    kommentar: Akkuwechsel, Sichtprüfung, Startfreigabe. Fällt bei jedem Flug an, auch leer
  - key: flug.lastwechsel_min
    label: An- und Abhängen je beladener Richtung
    einheit: min
    wert: 3
    min: 0
    max: 30
    step: 0.5
    status: Annahme
    quelle: Schätzung Team
    kommentar: Last am Start anhängen und am Ziel lösen. Bisher 6 min je Flug mit einer beladenen Richtung
- id: behaelter
  titel: Behälter
  beschreibung: Eigengewicht der Transportbehälter. Zählt zur Last am Haken.
  parameter:
  - key: box.grund_kg
    label: Grundbox
    einheit: kg
    wert: 5.04
    min: 0
    max: 30
    step: 0.1
    status: Annahme
    quelle: Transportbox Sprint 5-6, Blatt Gewichtsschätzung Box
    kommentar: Schätzung, durch Wiegen bestätigen
  - key: box.kassette_kg
    label: Grundbox mit Akku-Kassette
    einheit: kg
    wert: 7.59
    min: 0
    max: 30
    step: 0.1
    status: Annahme
    quelle: Transportbox Sprint 5-6, Blatt Gewichtsschätzung Box
    kommentar: Für lose Ersatzakkus (UN 3480)
  - key: box.ring_kg
    label: Grundbox mit 3. Aufsatzring
    einheit: kg
    wert: 5.64
    min: 0
    max: 30
    step: 0.1
    status: Annahme
    quelle: Transportbox Sprint 5-6, Blatt Gewichtsschätzung Box
    kommentar: Mehr Innenhöhe, z. B. für Rückengeräte
  - key: box.netz_kg
    label: Lastnetz für Langgut
    einheit: kg
    wert: 2.0
    min: 0
    max: 20
    step: 0.1
    status: Annahme
    quelle: Platzhalter
    kommentar: Für Teile, die nicht in die Box passen
  - key: box.innenlaenge_mm
    label: Innenlänge Box
    einheit: mm
    wert: 630
    typ: int
    min: 100
    max: 3000
    step: 10
    status: Annahme
    quelle: Transportbox Sprint 5-6, Blatt Gewichtsschätzung Box
    kommentar: Längere Teile gelten als Langgut
- id: profil
  titel: Flugprofil
  beschreibung: Raster der Höhenabfrage und zulässiger Höhenkorridor über Grund.
  parameter:
  - key: profil.raster_m
    label: Rasterabstand Höhenabfrage
    einheit: m
    wert: 30
    typ: int
    min: 10
    max: 500
    step: 10
    status: Annahme
    quelle: Passend zur Auflösung EU-DEM (25 m)
  - key: profil.min_agl_m
    label: Mindestabstand über Grund
    einheit: m
    wert: 30
    min: 5
    max: 150
    step: 5
    status: Annahme
    quelle: Sicherheitsabstand zu Bäumen und Hindernissen, mit Pilot abstimmen
  - key: profil.max_agl_m
    label: Maximale Höhe über Grund
    einheit: m
    wert: 120
    min: 20
    max: 300
    step: 10
    status: Regelwerk
    quelle: VO (EU) 2019/947, Grenze der Open-Kategorie
    kommentar: In der Specific-Kategorie gilt die Betriebsgenehmigung
- id: personal
  titel: Personal
  beschreibung: Eigene Crew. Die Kalkulation auf Folie 14 rechnet ohne Personal, deshalb standardmäßig aus.
  parameter:
  - key: personal.einrechnen
    label: Personalkosten einrechnen
    einheit: ja/nein
    wert: false
    typ: bool
    min: 0
    status: Annahme
    quelle: 'Folie 14: ohne Personalkosten'
    kommentar: ''
  - key: personal.pilot_eur_h
    label: Stundensatz Pilot
    einheit: €/h
    wert: 35
    min: 0
    max: 300
    step: 1
    status: Annahme
    quelle: Beispielwert aus dem Projektdokument
  - key: personal.helfer_n
    label: Helfer zusätzlich zum Pilot
    einheit: Personen
    typ: int
    wert: 1
    min: 0
    max: 10
    step: 1
    status: Annahme
    quelle: Einweiser am Lastaufnahmepunkt
  - key: personal.helfer_eur_h
    label: Stundensatz Helfer
    einheit: €/h
    wert: 30
    min: 0
    max: 300
    step: 1
    status: Annahme
    quelle: Platzhalter
- id: einsatz
  titel: Aufbau und Abbau
  beschreibung: Zeiten vor Ort je Einsatztag.
  parameter:
  - key: einsatz.aufbau_min
    label: Aufbau und Inbetriebnahme
    einheit: min
    wert: 45
    min: 0
    max: 300
    step: 5
    status: Annahme
    quelle: Schätzung Team
  - key: einsatz.abbau_min
    label: Abbau
    einheit: min
    wert: 30
    min: 0
    max: 300
    step: 5
    status: Annahme
    quelle: Schätzung Team
- id: invest
  titel: Investition FlyCart 100
  beschreibung: Einmalige Anschaffung im Eigenbetrieb, Grundlage der Abschreibung.
  parameter:
  - key: kalk.invest_equipment_eur
    label: Equipment (Drohne, Akkus, Ladetechnik, Zubehör)
    einheit: €
    wert: 53510
    min: 0
    max: 500000
    step: 100
    status: Literaturwert
    quelle: Excel „FlyCart100_Kalkulation“, Preise Online-Händler 13.11.2026, netto (Projekt-Review 6, Folie 14)
    kommentar: ''
  - key: kalk.invest_genehmigung_eur
    label: Genehmigung und SORA
    einheit: €
    wert: 4023
    min: 0
    max: 100000
    step: 100
    status: Literaturwert
    quelle: Gebühren Austro Control (Folie 14)
    kommentar: ''
  - key: kalk.invest_ausbildung_eur
    label: Ausbildung Pilot
    einheit: €
    wert: 1810
    min: 0
    max: 50000
    step: 10
    status: Literaturwert
    quelle: Excel „FlyCart100_Kalkulation“, Preise Online-Händler 13.11.2026, netto (Projekt-Review 6, Folie 14)
    kommentar: ''
  - key: kalk.nutzungsdauer_j
    label: Nutzungsdauer
    einheit: Jahre
    wert: 5
    typ: int
    min: 1
    max: 20
    step: 1
    status: Annahme
    quelle: 'Folie 14: 5 Jahre linear'
    kommentar: ''
- id: jahr
  titel: Fixkosten und Auslastung
  beschreibung: Fixkosten pro Jahr werden über die Flugminuten des Jahres auf den Einsatz verteilt.
  parameter:
  - key: kalk.fix_jahr_eur
    label: Fixkosten pro Jahr ohne Abschreibung
    einheit: €/Jahr
    wert: 4375
    min: 0
    max: 100000
    step: 50
    status: Literaturwert
    quelle: Excel „FlyCart100_Kalkulation“, Preise Online-Händler 13.11.2026, netto (Projekt-Review 6, Folie 14)
    kommentar: Haftpflicht, Inspektion, Software, Auffrischungen
  - key: kalk.auslastung_h
    label: Flugstunden pro Jahr (Auslastung)
    einheit: h/Jahr
    wert: 110
    min: 1
    max: 2000
    step: 5
    status: Annahme
    quelle: 'Folie 14: ab rund 110 h so günstig je kg wie der Helikopter'
    kommentar: Größter Hebel, z. B. eine Drohne für mehrere Betriebe
- id: variabel
  titel: Variable Kosten
  beschreibung: Kosten je Flugminute (nur Zeit in der Luft).
  parameter:
  - key: kalk.akku_eur_min
    label: Akkuverschleiß
    einheit: €/Flugminute
    wert: 0.26
    min: 0
    max: 20
    step: 0.01
    status: Literaturwert
    quelle: Excel „FlyCart100_Kalkulation“, Preise Online-Händler 13.11.2026, netto (Projekt-Review 6, Folie 14)
    kommentar: ''
  - key: kalk.laden_eur_min
    label: Laden per Generator
    einheit: €/Flugminute
    wert: 0.28
    min: 0
    max: 20
    step: 0.01
    status: Literaturwert
    quelle: Excel „FlyCart100_Kalkulation“, Preise Online-Händler 13.11.2026, netto (Projekt-Review 6, Folie 14)
    kommentar: ''
  - key: kalk.wartung_eur_min
    label: Wartung inkl. Rotoren
    einheit: €/Flugminute
    wert: 0.25
    min: 0
    max: 20
    step: 0.01
    status: Literaturwert
    quelle: Excel „FlyCart100_Kalkulation“, Preise Online-Händler 13.11.2026, netto (Projekt-Review 6, Folie 14)
    kommentar: ''
- id: akku
  titel: Flugakkus
  beschreibung: Wann ein Akkuwechsel nötig ist und ob das Laden mithält.
  parameter:
  - key: akku.flugzeit_min
    label: Flugzeit je Akkusatz
    einheit: min
    wert: 14
    min: 1
    max: 120
    step: 0.5
    status: Herstellerangabe
    quelle: 'DJI FlyCart 100 (Folie 14: 14 min Flugzeit)'
    kommentar: Planungswert bei voller Last
  - key: akku.reserve_pct
    label: Landereserve
    einheit: '%'
    wert: 20
    min: 0
    max: 60
    step: 5
    status: Annahme
    quelle: Sicherheitsreserve, mit Pilot abstimmen
    kommentar: Wird nicht verflogen
  - key: akku.saetze
    label: Akkusätze vor Ort
    einheit: Sätze
    wert: 2
    typ: int
    min: 1
    max: 10
    step: 1
    status: Annahme
    quelle: Annahme Team
    kommentar: Ein Satz = 2 Flugakkus
  - key: akku.ladezeit_min
    label: Ladezeit je Akkusatz
    einheit: min
    wert: 30
    min: 1
    max: 600
    step: 5
    status: Annahme
    quelle: Platzhalter, Ladegerät und Generator prüfen
    kommentar: ''
  - key: akku.wechsel_min
    label: Dauer Akkuwechsel
    einheit: min
    wert: 2
    min: 0
    max: 30
    step: 0.5
    status: Annahme
    quelle: Schätzung Team
    kommentar: ''
- id: wetter
  titel: Wetter
  beschreibung: Grenzwerte für die Flug-Ampel. Entscheidung vor Ort trifft der Pilot.
  parameter:
  - key: wetter.wind_max_ms
    label: Maximaler Wind in Flughöhe
    einheit: m/s
    wert: 10
    min: 2
    max: 30
    step: 0.5
    status: Annahme
    quelle: Vorsichtiger Planungswert mit Außenlast, Herstellerangabe der Drohne prüfen
  - key: wetter.boe_max_ms
    label: Maximale Böen
    einheit: m/s
    wert: 12
    min: 2
    max: 35
    step: 0.5
    status: Annahme
    quelle: Vorsichtiger Planungswert, Herstellerangabe prüfen
  - key: wetter.regen_max_mm
    label: Maximaler Niederschlag am Flugtag
    einheit: mm
    wert: 1.0
    min: 0
    max: 20
    step: 0.5
    status: Annahme
    quelle: Schutzklasse der Drohne prüfen
  - key: wetter.temp_min_c
    label: Mindesttemperatur
    einheit: °C
    wert: -5
    min: -30
    max: 15
    step: 1
    status: Annahme
    quelle: Akkuleistung bei Kälte, Herstellerangabe prüfen
