# ---------------------------------------------------------------------------
# Szenarien = benannte Abweichungen von den Basiswerten in parameter.yaml.
# Nicht aufgeführte Parameter behalten ihren Basiswert.
#
# Lesart:  konservativ = ungünstige Annahmen für die Drohne
#          optimistisch = günstige Annahmen für die Drohne
# Alle Werte sind Szenarioannahmen, keine Prognosen.
# ---------------------------------------------------------------------------

szenarien:

  - id: basis
    name: Basis
    beschreibung: Basiswerte aus parameter.yaml
    werte: {}

  - id: konservativ
    name: Konservativ
    beschreibung: Geringe Auslastung, kürzere Akkuflugzeit, längere Bodenzeiten
    werte:
      kalk.auslastung_h: 50
      akku.flugzeit_min: 11
      flug.umlauf_min: 4
      flug.lastwechsel_min: 4
      drohne.v_reise_ms: 8

  - id: optimistisch
    name: Optimistisch
    beschreibung: Eine Drohne für mehrere Betriebe, eingespieltes Team
    werte:
      kalk.auslastung_h: 250
      akku.saetze: 3
      flug.umlauf_min: 2
      flug.lastwechsel_min: 2
